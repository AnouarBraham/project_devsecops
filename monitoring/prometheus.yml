global:
  scrape_interval: 15s                       # scrape every target every 15 seconds
  evaluation_interval: 15s                   # evaluate alert rules every 15 seconds (none for now)

scrape_configs:
  - job_name: 'cybersecure-platform'         # label for this scrape job (shows in Prometheus UI)
    metrics_path: '/actuator/prometheus'     # the endpoint Prometheus requests on the target
    static_configs:
      - targets: ['host.docker.internal:8080']   # scrape our Spring Boot app running on the host